services:
  backend:
    build:
      context: ./backend
    container_name: wind-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Empty => same-origin /api, proxied to the backend by Nginx.
        VITE_API_BASE: ""
    container_name: wind-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
